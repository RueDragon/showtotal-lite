name: Publish Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match package version)
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item dist/*.exe,.env.example,QUICKSTART.txt -Destination dist/release
          $lines = Get-ChildItem dist/release -File | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          $lines | Set-Content dist/release/SHA256SUMS.txt -Encoding utf8
      - name: Publish assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "showTotal Lite $env:RELEASE_TAG" --generate-notes --draft }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
