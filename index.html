<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>showTotal Lite</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><img src="assets/showtotal.png" alt=""><span>showTotal <small>LITE</small></span></div><div class="controls"><button id="pin" title="切换置顶">置顶</button><button id="settings" title="配置">设置</button><button id="close" title="关闭">×</button></div></header>
<nav><button class="active" data-page="usage">用量</button><button data-page="logs">日志</button><button data-page="rank">榜单</button><button id="refresh" title="刷新当前页">↻</button></nav>
<main><section id="setup" hidden><h1>连接你的 API</h1><p>配置保存在本机 .env，不随软件分享。</p><form id="config-form"><label>接口地址（以 /api 结尾）<input id="base-url" type="url" required placeholder="https://your-api.example.com/api"></label><label>API key<input id="api-key" type="password" autocomplete="off" placeholder="填写你自己的 key"></label><label>团队路径（榜单使用）<input id="org-path" placeholder="按服务端提供的团队路径填写"></label><p class="hint">已有 key 时留空可保留。 .env 为明文文件，请勿转发。</p><button class="primary" type="submit">保存并连接</button><button id="forget" type="button">清除本机配置</button></form></section>
<section id="usage"><div class="cost"><span>今日花费</span><strong id="cost">--</strong><small id="requests">-- 次请求</small></div><div id="quotas"></div><div class="tokens" id="tokens"></div></section>
<section id="logs" hidden><div class="section-note">最近 100 条 · 费率：输入 / 输出 / 缓存命中</div><div id="log-list"></div></section>
<section id="rank" hidden><div class="rank-head"><span id="rank-date">昨日团队榜单</span><button id="sort-cost">费用</button><button id="sort-requests">请求</button></div><div id="rank-list"></div><button id="rank-more" hidden>加载更多</button></section></main>
<footer><span id="status">请先配置连接</span><span id="updated"></span></footer><script src="renderer.js"></script></body></html>
